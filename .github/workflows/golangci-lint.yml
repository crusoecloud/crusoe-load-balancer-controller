name: golangci-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: golangci-lint
        # v7+ of the action runs golangci-lint v2; keep the version equal to the
        # Makefile's GOLANGCI_LINT_VERSION (mo-cicd lints with that pin in GitLab).
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-mode: goinstall
          args: "--timeout=5m"
